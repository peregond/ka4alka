name: Verify native macOS application
on:
  push:
    branches: [claude/quirky-hopper-1vlmj6]
    paths: ['macos/**', 'desktop-core/**', 'desktop-host/**', 'native/**', 'update-core/**', 'mac-update-core/**', 'mac-update-tests/**', 'desktop-core-tests/**', 'scripts/test-desktop-ipc.py', 'scripts/macos/**', '.github/workflows/macos.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('**/*.csproj') }}
      - name: Build native application and self-contained shared engine
        run: bash scripts/macos/build.sh '${{ matrix.arch }}'
      - name: Verify shared queue, magnet transfers and deleted-file recovery
        run: dotnet run --project desktop-core-tests/Kachalka.DesktopCoreTests.csproj -c Release
      - name: Verify packaged pipe protocol without creating an idle torrent engine
        run: python3 scripts/test-desktop-ipc.py "$PWD/dist/macos-${{ matrix.arch }}/Ka4alka.app/Contents/Resources/engine/Kachalka.Engine"
      - name: Verify native models and signed updater
        working-directory: macos
        run: swift test -c release --jobs 3
      - name: Run native app with the packaged engine
        env:
          KACHALKA_DATA: ${{ github.workspace }}/test-output/macos/profile
        run: |
          mkdir -p "$KACHALKA_DATA/downloads"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['KACHALKA_DATA'])
          (root/'settings.json').write_text(json.dumps(dict(Folder=str(root/'downloads'),FolderConfigured=True,AutoResumeDownloads=False,CheckForUpdates=False,AutoUpdate=False,UiLanguage='ru')))
          PY
          output="$PWD/test-output/macos/render"
          app="$PWD/dist/macos-${{ matrix.arch }}/Ka4alka.app/Contents/MacOS/Ka4alka"
          "$app" --smoke-test "$output" &
          process=$!
          for ((attempt=0;attempt<180;attempt++)); do
            if ! kill -0 "$process" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$process" 2>/dev/null; then kill "$process"; echo 'Native macOS smoke timed out'; exit 1; fi
          wait "$process"
          test ! -f "$output/error.txt" || { cat "$output/error.txt"; exit 1; }
          test -f "$output/checks.json"
          cat "$output/checks.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/macos-${{ matrix.arch }}/Kachalka-macos-*.zip
            dist/macos-${{ matrix.arch }}/Kachalka-macos-*.dmg
            test-output/macos/render/
