name: Prepare verified Sites source
on:
  push:
    branches: [claude/quirky-hopper-1vlmj6]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sites-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    if: github.ref == 'refs/heads/claude/quirky-hopper-1vlmj6'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-index/package-lock.json
      - name: Verify source integrity regression
        working-directory: web-index
        run: node tests/source-integrity.mjs
      - name: Package the exact committed source
        run: node scripts/prepare-sites-source.mjs "$RUNNER_TEMP/sites-source"
      - name: Verify and build the actual publication archive
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/sites-candidate"
          export SITES_CANDIDATE="$candidate"
          python3 - <<'PY'
          import json, os, zipfile, hashlib
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP']) / 'sites-source'
          manifest = json.loads((folder / 'source-manifest.json').read_text())
          archive = folder / manifest['archive']
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == manifest['archiveSha256']
          with zipfile.ZipFile(archive) as source:
              source.extractall(os.environ['SITES_CANDIDATE'])
          PY
          cd "$candidate"
          node scripts/verify-source.mjs "$RUNNER_TEMP/sites-source/source-manifest.json"
          npm run install:ci
          node tests/title-lookup.mjs
          node tests/release-performance.mjs
          node tests/title-identity.mjs
          node tests/source-integrity.mjs
          node node_modules/typescript/bin/tsc --noEmit --incremental false
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: sites-source-${{ github.sha }}
          path: ${{ runner.temp }}/sites-source/
          if-no-files-found: error
          retention-days: 30
      - name: Describe the publication candidate
        run: |
          echo "Verified Sites source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Existing project: appgprj_6ac6006f8d248191acac74b581afe7ba; DB binding preserved.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Source is ready for the Sites publishing task. This workflow does not publish the Site.' >> "$GITHUB_STEP_SUMMARY"
