name: UI preview of the Windows banner
# A one-off helper: renders the catalog page the way the design smoke test does and stores the screenshots
# on the ui-previews branch, where they can be opened without signing in. Runs only for the preview branch.
on:
  push:
    branches: [preview/windows-banner]
permissions:
  contents: write
jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build the app
        shell: pwsh
        run: dotnet publish native/Kachalka.csproj -c Release -r win-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false -o dist/preview
      - name: Render the catalog page
        shell: pwsh
        run: |
          $root=$PWD.Path
          $state=Join-Path $root 'test-output/state'
          New-Item -ItemType Directory -Force $state | Out-Null
          $env:KACHALKA_DATA=$state
          $folder=Join-Path $state 'downloads';New-Item -ItemType Directory -Force $folder | Out-Null
          @{Folder=$folder;FolderConfigured=$true;AutoResumeDownloads=$false;CheckForUpdates=$false;AutoUpdate=$false} | ConvertTo-Json | Set-Content (Join-Path $state 'settings.json') -Encoding utf8NoBOM
          ./tests/CacheDesignPosters.ps1
          $evidence=Join-Path $root 'test-output/design-modern'
          $ui=Start-Process (Join-Path $root 'dist/preview/Kachalka.exe') -ArgumentList @('--design-smoke-test',('"'+$evidence+'"')) -PassThru
          if(-not $ui.WaitForExit(240000)){$ui.Kill($true);Write-Output 'The design run timed out; keeping what it rendered.'}
          Get-ChildItem $evidence -Filter 'catalog-*.png' | ForEach-Object {Write-Output $_.Name}
      - name: Store the screenshots on the ui-previews branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo=$env:GITHUB_REPOSITORY
          gh api "repos/$repo/git/ref/heads/ui-previews" 2>$null | Out-Null
          if($LASTEXITCODE -ne 0){gh api "repos/$repo/git/refs" -f ref=refs/heads/ui-previews -f sha=$env:GITHUB_SHA | Out-Null;if($LASTEXITCODE -ne 0){throw 'Cannot create the ui-previews branch'}}
          foreach($name in @('catalog-dark','catalog-light','catalog-dark-125')){
            $path=Join-Path $PWD.Path "test-output/design-modern/$name.png"
            if(-not(Test-Path $path)){Write-Output "Missing $name";continue}
            # The picture goes in a file: as a command-line argument it is too long for Windows.
            $body=Join-Path $env:RUNNER_TEMP "$name.json"
            @{message="Banner preview $name";content=[Convert]::ToBase64String([IO.File]::ReadAllBytes($path));branch='ui-previews'} | ConvertTo-Json | Set-Content $body -Encoding utf8NoBOM
            gh api -X PUT "repos/$repo/contents/previews/banner-$env:GITHUB_RUN_ID-$name.png" --input $body | Out-Null
            if($LASTEXITCODE -ne 0){throw "Cannot store $name"}
            Write-Output "https://raw.githubusercontent.com/$repo/ui-previews/previews/banner-$env:GITHUB_RUN_ID-$name.png"
          }
