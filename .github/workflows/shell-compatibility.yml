name: Windows shell coexistence
on:
  workflow_dispatch:
  push:
    branches: [codex/dark-default-0.28.1]
    paths: [.github/workflows/shell-compatibility.yml, tests/WindowsShellCompatibility.ps1]
permissions:
  contents: read
jobs:
  shell:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install NSIS with a bounded package-feed retry
        shell: pwsh
        run: ./scripts/install-nsis.ps1
      - name: Install and close Kachalka beside the official Open-Shell release
        shell: pwsh
        run: ./tests/WindowsShellCompatibility.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-coexistence-${{ matrix.os }}
          path: |
            test-output/shell-compatibility/checks.json
            test-output/shell-compatibility/close/*.json
            test-output/shell-compatibility/close/error.txt
