name: Android TV screenshots
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Build the debug app
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Allow hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Walk through the app on an Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/android/shots.sh shots android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-tv-shots
          path: shots
      - name: Publish the screenshots to the ui-previews branch
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -e
          git clone --quiet --depth 1 --branch ui-previews "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/previews"
          dir="$RUNNER_TEMP/previews/previews/android/${GITHUB_RUN_ID}"
          mkdir -p "$dir"; cp shots/* "$dir"/
          cd "$RUNNER_TEMP/previews"
          git config user.name github-actions; git config user.email actions@users.noreply.github.com
          git add -A previews/android; git commit -q -m "Android TV screenshots from run ${GITHUB_RUN_ID}"; git push -q origin ui-previews
