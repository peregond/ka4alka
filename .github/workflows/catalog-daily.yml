name: Refresh shared library daily
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shared-catalog
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check collector
        run: python scripts/test-refresh-library.py
      - name: Collect current films and series
        run: python scripts/refresh-library.py --output catalog-output/catalog.json
      - name: Publish complete library independently of application updates
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='catalog-data'
          gh release view $tag --json tagName 2>$null | Out-Null
          if($LASTEXITCODE -ne 0){
            gh release create $tag --target $env:GITHUB_SHA --title 'Обновляемая библиотека' --notes 'Общий каталог автоматически обновляется ежедневно около 05:00 UTC. Он содержит только метаданные фильмов и сериалов и не требует обновления приложения.' --latest=false
            if($LASTEXITCODE -ne 0){throw 'Cannot create shared catalog release'}
          }
          gh release upload $tag catalog-output/catalog.json --clobber
          if($LASTEXITCODE -ne 0){throw 'Cannot publish catalog'}
          gh release download $tag --pattern catalog.json --dir catalog-verified
          if($LASTEXITCODE -ne 0){throw 'Cannot verify published catalog'}
          if((Get-FileHash catalog-output/catalog.json).Hash -ne (Get-FileHash catalog-verified/catalog.json).Hash){throw 'Catalog readback checksum mismatch'}
          $feed=Get-Content catalog-verified/catalog.json -Raw | ConvertFrom-Json
          "Published $($feed.items.Count) entries, generated $($feed.generatedAtUtc)." >> $env:GITHUB_STEP_SUMMARY
