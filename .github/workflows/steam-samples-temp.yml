name: Steam samples (temporary)
# Temporary: fetches live Steam store responses on a runner and commits them to the same branch so the
# catalogue parser can be written against real data. Removed together with the samples before the pull request.
on:
  push:
    branches: [claude/brave-galileo-7mt77d]
    paths: ['.github/workflows/steam-samples-temp.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch samples
        run: |
          set -u
          dir=steam-samples; mkdir -p $dir
          base='https://store.steampowered.com/search/results/'
          get() { curl -sS -m 40 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' -o "$dir/$1" -w "$1 %{http_code} %{size_download}\n" "$2" || echo "$1 FAILED"; }
          mkdir -p $dir
          python3 - <<'PY'
          import json,re,urllib.request,concurrent.futures as cf
          out=open('steam-samples/r4-image-status.txt','w')
          bases={}
          for name in ['top','popularnew','specials','popularwishlist']:
              pass
          import glob
          for f in glob.glob('steam-samples/r2-*.json'):
              try: d=json.load(open(f))
              except Exception: continue
              if not isinstance(d,dict): continue
              for m in re.finditer(r'search_capsule"><img src="([^"?]+)/capsule_231x87\.jpg',d.get('results_html','')):
                  base=m.group(1)
                  found=re.search(r'/apps/(\d+)',base)
                  if found: bases[found.group(1)]=base
          ids=list(bases)[:90]
          def head(url):
              try:
                  req=urllib.request.Request(url,method='HEAD',headers={'User-Agent':'Mozilla/5.0'})
                  return urllib.request.urlopen(req,timeout=20).status
              except Exception as e:
                  return getattr(e,'code',0)
          jobs=[]
          with cf.ThreadPoolExecutor(8) as pool:
              for i in ids:
                  for kind in ['header.jpg','capsule_616x353.jpg','capsule_467x181.jpg','capsule_231x87.jpg']:
                      url=bases[i]+'/'+kind
                      jobs.append((i,kind,pool.submit(head,url),'hashed' if re.search(r'/apps/\d+/[0-9a-f]{20,}',bases[i]) else 'plain'))
              for i,kind,f,t in jobs:
                  out.write(f'{i} {t} {kind} {f.result()}\n')
          PY
          awk '{c[$2" "$3" "$4]++} END{for(k in c) print k, c[k]}' steam-samples/r4-image-status.txt | sort
          ls -la $dir
      - name: Commit samples
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f steam-samples
          git commit -m 'Temporary Steam response samples' || exit 0
          git push origin HEAD:${{ github.ref_name }}
