name: Steam samples (temporary)
# Temporary: fetches live Steam store responses on a runner and commits them to the same branch so the
# catalogue parser can be written against real data. Removed together with the samples before the pull request.
on:
  push:
    branches: [claude/brave-galileo-7mt77d]
    paths: ['.github/workflows/steam-samples-temp.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch samples
        run: |
          set -u
          dir=steam-samples; mkdir -p $dir
          base='https://store.steampowered.com/search/results/'
          get() { curl -sS -m 40 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' -o "$dir/$1" -w "$1 %{http_code} %{size_download}\n" "$2" || echo "$1 FAILED"; }
          h="$base?query&category1=998&os=win&untags=113&l=russian&infinite=1"
          get r2-top-c40-s0.json "$h&count=40&start=0&sort_by=_ASC&filter=topsellers"
          get r2-top-c40-s40.json "$h&count=40&start=40&sort_by=_ASC&filter=topsellers"
          get r2-top-c100-s0.json "$h&count=100&start=0&sort_by=_ASC&filter=topsellers"
          get r2-popularnew.json "$h&count=40&start=0&filter=popularnew"
          get r2-popularnew-s40.json "$h&count=40&start=40&filter=popularnew"
          get r2-newreleases.json "$h&count=40&start=0&filter=newreleases"
          get r2-popularwishlist.json "$h&count=40&start=0&filter=popularwishlist"
          get r2-popularcoming.json "$h&count=40&start=0&filter=popularcomingsoon"
          get r2-globaltop.json "$h&count=40&start=0&filter=globaltopsellers"
          get r2-specials-c40.json "$h&count=40&start=0&specials=1&filter=topsellers"
          get r2-rpg-c40.json "$h&count=40&start=0&tags=122&filter=topsellers"
          get r2-rpg-new.json "$h&count=40&start=0&tags=122&filter=popularnew"
          get r2-reviews-sort.json "$h&count=40&start=0&sort_by=Reviews_DESC"
          get r2-storesearch.json "https://store.steampowered.com/api/storesearch/?term=elden&l=russian&cc=us"
          get r2-populartags.json "https://store.steampowered.com/tagdata/populartags/russian"
          get r2-appreviews-ru.json "https://store.steampowered.com/appreviews/620?json=1&language=russian&purchase_type=all&num_per_page=0"
          ls -la $dir
      - name: Commit samples
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f steam-samples
          git commit -m 'Temporary Steam response samples' || exit 0
          git push origin HEAD:${{ github.ref_name }}
