name: Capture published application screenshots
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      publish_reviewed:
        type: boolean
        default: false
      settings_only:
        type: boolean
        default: false
      language:
        type: string
        default: both
  workflow_dispatch:
    inputs:
      version:
        description: Published version to capture
        required: true
        default: '0.44.27'
      settings_only:
        description: Capture only Lite mode and LAN phone settings
        type: boolean
        default: false
      language:
        description: Language to capture
        type: choice
        options: [both, ru, en]
        default: both
      publish_reviewed:
        description: Publish reviewed repository screenshots instead of capturing again
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: documentation-preview-${{ github.ref_name }}-${{ inputs.settings_only && 'settings' || 'all' }}
  cancel-in-progress: true
jobs:
  publish-reviewed:
    if: inputs.publish_reviewed
    uses: ./.github/workflows/publish-screenshots.yml
    with:
      version: ${{ inputs.version }}
  screenshots:
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.language == 'en' && '["en"]' || inputs.language == 'ru' && '["ru"]' || '["ru","en"]') }}
    if: ${{ !inputs.publish_reviewed }}
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      RELEASE_VERSION: ${{ inputs.version }}
      KACHALKA_SCREENSHOT_VERSION: ${{ inputs.version }}
      KACHALKA_SCREENSHOT_LANGUAGE: ${{ matrix.language }}
      KACHALKA_SCREENSHOT_SCOPE: ${{ inputs.settings_only && 'settings' || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Download and verify the published application
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $version=[Version]$env:RELEASE_VERSION
          $source=Join-Path $env:RUNNER_TEMP ('kachalka-published-'+$version)
          New-Item -ItemType Directory -Force $source | Out-Null
          gh release download ('v'+$version) --repo peregond/ka4alka --dir $source
          if($LASTEXITCODE -ne 0){throw 'Cannot download the published application'}
          dotnet run --project update-tests/Kachalka.UpdateTests.csproj -c Release -- --verify-release $source
          if($LASTEXITCODE -ne 0){throw 'Published package signature or contents invalid'}
          $archive=Join-Path $source 'Kachalka-win-x64.zip'
          $archiveHash=(Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          ('RELEASE_ARCHIVE_SHA256='+$archiveHash) >> $env:GITHUB_ENV
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $source 'application')
          $release=Join-Path $source ('application/Kachalka-'+$version.ToString(2))
          $assembly=Join-Path $release 'Kachalka.dll'
          if(-not(Test-Path -LiteralPath (Join-Path $release 'Kachalka.exe')) -or -not(Test-Path -LiteralPath $assembly)){throw 'Published application directory is incomplete'}
          if([System.Reflection.AssemblyName]::GetAssemblyName($assembly).Version.ToString(3) -ne $env:RELEASE_VERSION){throw 'Published assembly has the wrong version'}
          ('KACHALKA_SCREENSHOT_RELEASE='+$release) >> $env:GITHUB_ENV
          ('KACHALKA_DATA='+(Join-Path $env:RUNNER_TEMP 'kachalka-screenshot-state')) >> $env:GITHUB_ENV
      - name: Build the screenshot driver against the published DLL
        shell: pwsh
        run: |
          dotnet build scripts/screenshots/CaptureReleaseScreenshot.csproj -c Release ('-p:ReleaseDirectory='+$env:KACHALKA_SCREENSHOT_RELEASE)
          if($LASTEXITCODE -ne 0){throw 'Screenshot driver failed to build'}
      - name: Capture the actual released application
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $output=Join-Path $PWD 'test-output/documentation-${{ matrix.language }}'
          New-Item -ItemType Directory -Force $output | Out-Null
          $driver=Join-Path $PWD 'scripts/screenshots/bin/Release/net10.0-windows/CaptureReleaseScreenshot.dll'
          $stdout=Join-Path $env:RUNNER_TEMP 'kachalka-capture-stdout.txt'
          $stderr=Join-Path $env:RUNNER_TEMP 'kachalka-capture-stderr.txt'
          $process=Start-Process -RedirectStandardOutput $stdout -RedirectStandardError $stderr -FilePath 'dotnet' -ArgumentList @(('"'+$driver+'"'),('"'+$env:KACHALKA_SCREENSHOT_RELEASE+'"'),('"'+$output+'"')) -PassThru
          try {
            if(-not $process.WaitForExit(540000)){$process.Kill($true);throw 'Released application screenshot capture exceeded nine minutes'}
            if($process.ExitCode -ne 0){
              if(Test-Path -LiteralPath $stdout){Get-Content -LiteralPath $stdout}
              if(Test-Path -LiteralPath $stderr){Get-Content -LiteralPath $stderr}
              throw ('Released application screenshot capture failed: '+$process.ExitCode)
            }
            Get-Content -LiteralPath $stdout
          } finally { $process.Dispose() }
          $infoPath=Join-Path $output 'capture-info.json'
          if(-not(Test-Path -LiteralPath $infoPath)){throw 'Capture metadata is missing'}
          $info=Get-Content -LiteralPath $infoPath -Raw | ConvertFrom-Json
          $dllHash=(Get-FileHash -LiteralPath (Join-Path $env:KACHALKA_SCREENSHOT_RELEASE 'Kachalka.dll') -Algorithm SHA256).Hash.ToLowerInvariant()
          if($info.Version -ne $env:RELEASE_VERSION -or $info.ReleaseDllSha256 -ne $dllHash){throw 'Screenshots were not captured from the verified published DLL'}
          if($info.Language -ne $env:KACHALKA_SCREENSHOT_LANGUAGE){throw 'Capture language mismatch'}
          $required=@('settings-lite-dark.png','settings-lan-dark.png')
          if($env:KACHALKA_SCREENSHOT_SCOPE -ne 'settings'){$required+=@('featured-dark.png','catalog-dark.png','catalog-light.png','series-dark.png','detail-dark.png','games-dark.png','games-light.png','game-detail-dark.png','downloads-dark.png','settings-dark.png')}
          foreach($name in $required){
            if(-not(Test-Path -LiteralPath (Join-Path $output $name))){throw ('Missing required screenshot: '+$name)}
          }
          # Persist only public screenshot metadata, never the isolated profile or keys.
          $captures=@($info.Captures | ForEach-Object {
            if($_.File -notmatch '^[a-z0-9][a-z0-9.-]*\.png$'){throw 'Invalid capture filename'}
            [ordered]@{File=$_.File;Language=$_.Language;Width=$_.Width;Height=$_.Height;LoadedVisiblePosters=$_.LoadedVisiblePosters;PendingVisiblePosters=$_.PendingVisiblePosters;Titles=@($_.Titles)}
          })
          [ordered]@{Version=$env:RELEASE_VERSION;Language=$env:KACHALKA_SCREENSHOT_LANGUAGE;CaptureMethod=$info.CaptureMethod;ReleaseArchiveSha256=$env:RELEASE_ARCHIVE_SHA256;ReleaseDllSha256=$dllHash;Captures=$captures} | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $infoPath -Encoding utf8NoBOM
          Get-Content -LiteralPath $infoPath
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish verified platform gallery assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install Pillow==11.3.0
          if($LASTEXITCODE -ne 0){throw 'Image encoder install failed'}
          $output='test-output/gallery-${{ matrix.language }}'
          $scope=@()
          if($env:KACHALKA_SCREENSHOT_SCOPE -eq 'settings'){$scope=@('settings')}
          python scripts/screenshots/package-windows.py $env:RELEASE_VERSION '${{ matrix.language }}' 'test-output/documentation-${{ matrix.language }}' $output @scope
          if($LASTEXITCODE -ne 0){throw 'Screenshot verification failed'}
          $files=@(Get-ChildItem $output -File | ForEach-Object {$_.FullName})
          gh release upload ('v'+$env:RELEASE_VERSION) @files --clobber
          if($LASTEXITCODE -ne 0){throw 'Screenshot upload failed'}
      - name: Preserve sanitized screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-documentation-screenshots-${{ matrix.language }}
          path: |
            test-output/documentation-${{ matrix.language }}/*.png
            test-output/documentation-${{ matrix.language }}/capture-info.json
