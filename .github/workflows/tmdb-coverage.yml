name: TMDB coverage probe
# Measures what share of the shared library TMDB can describe (a sample), without changing the library.
# Needs the repository secret TMDB_API_KEY (a v3 API key or a v4 read access token).
on:
  workflow_dispatch:
    inputs:
      sample:
        description: Number of titles to ask TMDB about
        default: '300'
        required: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check the probe
        run: python3 scripts/test-tmdb-coverage.py
      - name: Download the published library
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download catalog-data --pattern catalog.json --dir probe-input --repo "$GITHUB_REPOSITORY"
      - name: Ask TMDB about a sample
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 scripts/probe-tmdb-coverage.py --catalog probe-input/catalog.json --sample "${{ inputs.sample || '300' }}" --report tmdb-coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmdb-coverage
          path: tmdb-coverage.json
          if-no-files-found: ignore
