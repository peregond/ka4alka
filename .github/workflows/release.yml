name: Prepare signed Windows release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching native/Kachalka.csproj
        required: true
        default: '0.26.1'
  push:
    branches: [codex/new-site-0.26.1]
    paths: [.github/workflows/release.yml, 'native/**', 'update-core/**', 'updater/**', 'update-tests/**', 'tests/**', 'installer/**', build-release.ps1, package-release.ps1]
permissions:
  contents: write
concurrency:
  group: kachalka-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      RELEASE_VERSION: ${{ inputs.version || '0.26.1' }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify public replacement site
        shell: pwsh
        run: ./tests/PublishedSiteProbe.ps1
      - name: Install NSIS
        run: choco install nsis --yes --no-progress
      - name: Validate Windows installation and update
        shell: pwsh
        run: |
          try { ./tests/WindowsUpdateSmoke.ps1 }
          catch {
            $message=$_.Exception.Message.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows update smoke::$message"
            throw
          }
      - name: Build production package with release-signing key
        shell: pwsh
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.KACHALKA_UPDATE_SIGNING_KEY_PEM }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:RELEASE_SIGNING_KEY)){throw 'Missing KACHALKA_UPDATE_SIGNING_KEY_PEM repository secret'}
          $key=Join-Path $env:RUNNER_TEMP 'kachalka-release-key.pem'
          try {
            [System.IO.File]::WriteAllText($key,$env:RELEASE_SIGNING_KEY)
            ./build-release.ps1 -Version $env:RELEASE_VERSION -SigningKeyPath $key -MakeNsis 'C:/Program Files (x86)/NSIS/makensis.exe'
          } finally { Remove-Item $key -ErrorAction SilentlyContinue }
      - name: Verify upgrade from previously published 0.26.0
        shell: pwsh
        run: ./tests/WindowsPublishedUpgrade.ps1 -ReleaseDirectory ('dist/release-'+$env:RELEASE_VERSION)
      - name: Upload verified files to draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version=$env:RELEASE_VERSION
          $tag='v'+$version
          $notes='distribution/RELEASE-NOTES-'+$version+'.md'
          if(-not (Test-Path $notes)){$notes='distribution/RELEASE-NOTES-'+([Version]$version).ToString(2)+'.md'}
          $existing=gh release view $tag --json isDraft --jq '.isDraft' 2>$null
          if($LASTEXITCODE -ne 0){
            gh release create $tag --draft --target $env:GITHUB_SHA --title ('Качалка '+$version) --notes-file $notes
            if($LASTEXITCODE -ne 0){throw 'Cannot create draft release'}
          } elseif($existing -ne 'true'){throw 'Refusing to overwrite a published release'}
          gh release edit $tag --draft --target $env:GITHUB_SHA --notes-file $notes
          if($LASTEXITCODE -ne 0){throw 'Cannot update draft release'}
          $files=@(Get-ChildItem -LiteralPath ('dist/release-'+$version) -File | ForEach-Object {$_.FullName})
          gh release upload $tag @files --clobber
          if($LASTEXITCODE -ne 0){throw 'Cannot upload release assets'}
          # Read back exact uploaded bytes and compare to the signed package.
          $download=Join-Path $env:RUNNER_TEMP 'verified-release'
          New-Item -ItemType Directory -Force $download | Out-Null
          gh release download $tag --dir $download
          if($LASTEXITCODE -ne 0){throw 'Cannot read back release assets'}
          foreach($file in $files){
            if((Get-FileHash $file -Algorithm SHA256).Hash -ne (Get-FileHash (Join-Path $download ([System.IO.Path]::GetFileName($file))) -Algorithm SHA256).Hash){throw 'Uploaded file checksum mismatch'}
          }
          dotnet run --project update-tests/Kachalka.UpdateTests.csproj -c Release -- --verify-release $download
          if($LASTEXITCODE -ne 0){throw 'Uploaded package signature or contents invalid'}
          'Windows validation passed; uploaded assets read back with matching SHA256 and valid publisher signature.' >> $env:GITHUB_STEP_SUMMARY
      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-windows-update-evidence
          path: |
            test-output/windows-update/checks.txt
            test-output/catalog-paging/*
            test-output/search-downloads/*
            test-output/download-end-to-end/*.json
            test-output/download-end-to-end/error.txt
            test-output/published-site/checks.json
            test-output/published-upgrade/checks.txt
            test-output/published-upgrade/data/updates/*/result.txt
            test-output/windows-update/data/updates/*/result.txt
