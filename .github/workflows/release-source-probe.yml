name: Release source diagnostics
on:
  push:
    branches: [codex/catalog-fixes-0.21.1]
    paths: [.github/workflows/release-source-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Kachalka.Tests.csproj -c Release -- --probe-releases
