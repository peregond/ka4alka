name: Publish reviewed release screenshots
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Published release matching the reviewed screenshots
        required: true
        default: '0.44.28'
permissions:
  contents: write
concurrency:
  group: publish-screenshots-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Publish only screenshots and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ -f "distribution/assets/$RELEASE_VERSION/capture-info.json" ]; then
            python3 scripts/screenshots/publish-gallery.py "$RELEASE_VERSION"
            exit 0
          fi
          python3 - <<'PY'
          import json, os, re, shutil, subprocess, tempfile, zipfile
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Invalid release version')
          tag = 'v' + version
          folder = Path('distribution/assets') / version
          if not folder.exists():
              folder = Path('distribution/assets') / '.'.join(version.split('.')[:2])
          info = json.loads((folder / ('capture-' + version + '.json')).read_text())
          if info['Version'] != version:
              raise SystemExit('Screenshot version mismatch')
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', tag, '--json', 'isDraft,assets']))
          if release['isDraft']:
              raise SystemExit('Screenshots require an already published release')
          archive = next(a for a in release['assets'] if a['name'] == 'Kachalka-win-x64.zip')
          digest = archive.get('digest')
          if digest and digest != 'sha256:' + info['ReleaseArchiveSha256']:
              raise SystemExit('Screenshots do not match the published archive')
          notes = Path('distribution/RELEASE-NOTES-' + version + '.md')
          files = {}
          for capture in info['Captures']:
              source = capture['File'].removesuffix('.png')
              if not re.fullmatch(r'(?:ru/|en/)?[a-z0-9-]+', source):
                  raise SystemExit('Invalid screenshot path')
              files[source.replace('/', '-')] = source
          with tempfile.TemporaryDirectory() as tmp:
              uploads = []
              for target, source in files.items():
                  path = folder / (source + '.png')
                  if path.read_bytes()[:8] != b'\x89PNG\r\n\x1a\n':
                      raise SystemExit('Invalid screenshot: ' + source)
                  asset = Path(tmp) / ('screenshot-' + target + '.png')
                  shutil.copyfile(path, asset)
                  uploads.append(str(asset))
              landing = Path(tmp) / ('landing-media-' + version + '.zip')
              with zipfile.ZipFile(landing, 'w', zipfile.ZIP_DEFLATED) as bundle:
                  for source in files.values():
                      bundle.write(folder / (source + '.png'), 'screenshots/' + source + '.png')
                  bundle.write(folder / ('capture-' + version + '.json'), 'capture-info.json')
                  bundle.write('distribution/LANDING-COPY.md', 'LANDING-COPY.md')
                  landing_readme = Path('distribution/README.md').read_text().replace('assets/' + folder.name + '/capture-' + version + '.json', 'capture-info.json').replace('assets/' + folder.name + '/', 'screenshots/')
                  bundle.writestr('README.md', landing_readme)
                  bundle.write('native/Assets/logo.png', 'logo.png')
              uploads.append(str(landing))
              # These explicit names can replace screenshots only, never update packages.
              subprocess.run(['gh', 'release', 'upload', tag, *uploads, '--clobber'], check=True)
          subprocess.run(['gh', 'release', 'edit', tag, '--notes-file', str(notes)], check=True)
          print('Published reviewed screenshots and release notes for ' + tag)
          PY
