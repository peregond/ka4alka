name: Publish reviewed release screenshots
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Published release matching the reviewed screenshots
        required: true
        default: '0.40.18'
permissions:
  contents: write
concurrency:
  group: publish-screenshots-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Publish only screenshots and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, re, shutil, subprocess, tempfile
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Invalid release version')
          tag = 'v' + version
          folder = Path('distribution/assets') / '.'.join(version.split('.')[:2])
          info = json.loads((folder / ('capture-' + version + '.json')).read_text())
          if info['Version'] != version:
              raise SystemExit('Screenshot version mismatch')
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', tag, '--json', 'isDraft,assets']))
          if release['isDraft']:
              raise SystemExit('Screenshots require an already published release')
          archive = next(a for a in release['assets'] if a['name'] == 'Kachalka-win-x64.zip')
          digest = archive.get('digest')
          if digest and digest != 'sha256:' + info['ReleaseArchiveSha256']:
              raise SystemExit('Screenshots do not match the published archive')
          notes = Path('distribution/RELEASE-NOTES-' + version + '.md')
          files = {
              'catalog-dark': 'catalog-dark', 'catalog-light': 'catalog-light',
              'series-dark': 'series-dark', 'detail-dark': 'detail-wide-dark',
              'downloads-dark': 'downloads-dark', 'settings-dark': 'settings-dark',
              'lan-pairing-dark': 'lan-pairing-dark'
          }
          with tempfile.TemporaryDirectory() as tmp:
              uploads = []
              for target, source in files.items():
                  path = folder / (source + '.png')
                  if path.read_bytes()[:8] != b'\x89PNG\r\n\x1a\n':
                      raise SystemExit('Invalid screenshot: ' + source)
                  asset = Path(tmp) / ('screenshot-' + target + '.png')
                  shutil.copyfile(path, asset)
                  uploads.append(str(asset))
              # These explicit names can replace screenshots only, never update packages.
              subprocess.run(['gh', 'release', 'upload', tag, *uploads, '--clobber'], check=True)
          subprocess.run(['gh', 'release', 'edit', tag, '--notes-file', str(notes)], check=True)
          print('Published seven reviewed screenshots and release notes for ' + tag)
          PY
