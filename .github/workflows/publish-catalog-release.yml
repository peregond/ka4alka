name: Publish catalog and application 0.40.14
on:
  push:
    branches: [release/0.40.14]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-catalog-app-0.40.14
  cancel-in-progress: true
jobs:
  catalog:
    uses: ./.github/workflows/catalog-daily.yml
    with:
      # Reuse the metadata already refreshed for this publication; daily runs
      # retain their normal 1000-record / 600-second enrichment budget.
      detail_limit: '0'
      metadata_budget_seconds: '0'
    secrets: inherit
  application:
    needs: catalog
    uses: ./.github/workflows/release.yml
    with:
      version: '0.40.14'
      publish: true
    secrets: inherit
