name: Window frame probe (temporary)
# TEMPORARY: compares ways of dropping the main window's caption under the cinema smoke.
# Removed together with native/WindowFrameProbe.cs once the full-height window is settled.
on:
  push:
    branches: [claude/cool-turing-p412ok]
    paths: ['.github/workflows/chrome-probe.yml', 'native/**']
permissions:
  contents: read
concurrency:
  group: chrome-probe-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [native, chrome0, chrome1, chrome0-fit, manual]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Publish the app
        shell: pwsh
        run: |
          dotnet publish native/Kachalka.csproj -c Release -r win-x64 --self-contained true -o dist/probe -p:DebugType=None -p:DebugSymbols=false
          if($LASTEXITCODE -ne 0){throw 'Publish failed'}
      - name: Cinema smoke with frame ${{ matrix.variant }}
        shell: pwsh
        env:
          KACHALKA_WINDOW_FRAME: ${{ matrix.variant }}
        run: |
          $env:KACHALKA_DATA=Join-Path $env:RUNNER_TEMP 'probe-data'
          $output=Join-Path $pwd 'test-output/cinema-ui'
          $process=Start-Process dist/probe/Kachalka.exe -ArgumentList @('--cinema-smoke-test',('"'+$output+'"')) -PassThru
          $finished=$process.WaitForExit(60000)
          if(-not $finished){$process.Kill($true)}
          if(Test-Path "$output/error.txt"){Get-Content "$output/error.txt" -Raw}
          if(-not $finished -or (Test-Path "$output/error.txt") -or -not (Test-Path "$output/checks.json")){throw 'Cinema smoke failed with frame ${{ matrix.variant }}'}
          'PASS: cinema smoke with frame ${{ matrix.variant }}'
