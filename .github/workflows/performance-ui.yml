name: Verify bounded background work and image loading
on:
  push:
    branches: [claude/quirky-hopper-1vlmj6]
    paths: ['.github/workflows/performance-ui.yml', 'native/**', 'tests/**']
  workflow_dispatch:
concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  performance:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        processors: [2, 4]
    env:
      DOTNET_PROCESSOR_COUNT: ${{ matrix.processors }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Verify memory budgets, shared cancellation, persisted thumbnails and incremental search
        run: |
          dotnet run --project tests/Kachalka.Tests.csproj -c Release -- --performance-only
          dotnet run --project tests/Kachalka.Tests.csproj -c Release -- --home-availability-only
          dotnet run --project tests/Kachalka.Tests.csproj -c Release -- --games-only
          dotnet run --project tests/Kachalka.Tests.csproj -c Release -- --missing-files-only
          dotnet run --project tests/Kachalka.Tests.csproj -c Release -- --language-only
      - name: Verify actual WPF viewport loading and responsive person profiles
        shell: pwsh
        run: |
          foreach ($mode in @('search-downloads','feature-summary','release-freshness','cover-viewport','poster-actions','person-performance','startup-performance','home-availability','games','catalog-navigation','interface-polish','language','queue-virtualization')) {
            $env:KACHALKA_DATA=Join-Path $PWD "test-output/performance/$mode/profile"
            $folder=Join-Path $env:KACHALKA_DATA 'downloads'
            New-Item -ItemType Directory -Force $folder | Out-Null
            @{Folder=$folder;FolderConfigured=$true;AutoResumeDownloads=$false;CheckForUpdates=$false;AutoUpdate=$false;LiteMode=$false;LiteModeConfigured=$true} | ConvertTo-Json | Set-Content (Join-Path $env:KACHALKA_DATA 'settings.json') -Encoding utf8NoBOM
            $output=Join-Path $PWD "test-output/performance/$mode/render"
            $app=Start-Process (Join-Path $PWD 'native/bin/Release/net10.0-windows/Kachalka.exe') -ArgumentList @("--$mode-smoke-test",('"'+$output+'"')) -PassThru
            $deadline=if($mode -eq 'search-downloads'){60000}else{120000}
            if(-not $app.WaitForExit($deadline)){$app.Kill($true);throw "$mode timed out"}
            if(Test-Path (Join-Path $output 'error.txt')){throw (Get-Content (Join-Path $output 'error.txt') -Raw)}
            if($app.ExitCode -ne 0 -or -not(Test-Path (Join-Path $output 'checks.json'))){throw "$mode checks missing"}
            Get-Content (Join-Path $output 'checks.json')
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-${{ matrix.processors }}cpu-${{ github.sha }}
          path: test-output/performance/
          if-no-files-found: ignore
