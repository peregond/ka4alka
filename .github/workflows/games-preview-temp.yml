name: Games preview (temporary)
# Temporary: renders the games smoke test on Windows and commits compressed screenshots to the same branch
# so the pages can be reviewed. Removed together with the screenshots before the pull request is finished. Run for the games interface work.
on:
  push:
    branches: [claude/brave-galileo-7mt77d]
    paths: ['.github/workflows/games-preview-temp.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build native/Kachalka.csproj -c Release
      - name: Render the games pages
        shell: pwsh
        run: |
          $env:KACHALKA_DATA=Join-Path $PWD 'test-output/games-preview/profile'
          $folder=Join-Path $env:KACHALKA_DATA 'downloads'
          New-Item -ItemType Directory -Force $folder | Out-Null
          @{Folder=$folder;FolderConfigured=$true;AutoResumeDownloads=$false;CheckForUpdates=$false;AutoUpdate=$false;LiteMode=$false;LiteModeConfigured=$true} | ConvertTo-Json | Set-Content (Join-Path $env:KACHALKA_DATA 'settings.json') -Encoding utf8NoBOM
          $output=Join-Path $PWD 'test-output/games-preview/render'
          $app=Start-Process (Join-Path $PWD 'native/bin/Release/net10.0-windows/Kachalka.exe') -ArgumentList @('--games-smoke-test',('"'+$output+'"')) -PassThru
          if(-not $app.WaitForExit(120000)){$app.Kill($true);throw 'games smoke timed out'}
          if(Test-Path (Join-Path $output 'error.txt')){throw (Get-Content (Join-Path $output 'error.txt') -Raw)}
          Get-ChildItem $output -Filter *.png | ForEach-Object { Write-Output ($_.Name+' '+$_.Length) }
      - name: Commit compressed screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $target=Join-Path $PWD 'preview-games'
          New-Item -ItemType Directory -Force $target | Out-Null
          $codec=[System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object {$_.MimeType -eq 'image/jpeg'}
          $parameters=New-Object System.Drawing.Imaging.EncoderParameters(1)
          $parameters.Param[0]=New-Object System.Drawing.Imaging.EncoderParameter([System.Drawing.Imaging.Encoder]::Quality,[long]72)
          foreach($file in Get-ChildItem 'test-output/games-preview/render' -Filter *.png){
            $image=[System.Drawing.Image]::FromFile($file.FullName)
            $image.Save((Join-Path $target ($file.BaseName+'.jpg')),$codec,$parameters)
            $image.Dispose()
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview-games
          git commit -m 'Temporary games preview screenshots'
          git push origin HEAD:${{ github.ref_name }}
