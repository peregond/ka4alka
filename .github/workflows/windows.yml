name: Windows release validation
on:
  push:
    branches: [codex/dark-default-0.28.1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install NSIS
        run: choco install nsis --yes --no-progress
      - name: Validate installer and signed update on Windows
        shell: pwsh
        run: |
          try { ./tests/WindowsUpdateSmoke.ps1 }
          catch {
            $message=$_.Exception.Message.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows update smoke::$message"
            throw
          }
      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-update-evidence
          path: |
            test-output/windows-update/checks.txt
            test-output/catalog-paging/*
            test-output/search-downloads/*
            test-output/download-end-to-end/*.json
            test-output/download-end-to-end/error.txt
            test-output/windows-update/data/updates/*/result.txt
