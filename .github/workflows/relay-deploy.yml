name: Deploy relay for Russia and Belarus
# The site's hosting refuses visitors from Russia and Belarus. This deploys
# relay-worker/ to Cloudflare Workers, checks it from Russian networks and adds
# its address to distribution/relays.json, which the application reads.
# Repository secrets: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers")
# and CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
    inputs:
      relay_url:
        description: Relay address, if it is served from your own domain instead of workers.dev
        required: false
        default: ''
      publish:
        description: Add the address to distribution/relays.json for the application
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: relay-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the site toolchain
        working-directory: web-index
        run: npm ci --no-audit --no-fund
      - name: Check the relay code
        run: |
          node web-index/tests/torrent-relay.mjs
          web-index/node_modules/.bin/tsc -p relay-worker/tsconfig.json
      - name: Deploy to Cloudflare Workers
        id: deploy
        working-directory: relay-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELAY_URL: ${{ inputs.relay_url }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Cloudflare secrets::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets and variables → Actions."
            exit 1
          fi
          ../web-index/node_modules/.bin/wrangler deploy 2>&1 | tee deploy.log
          url="$RELAY_URL"
          if [ -z "$url" ]; then url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n 1); fi
          if [ -z "$url" ]; then echo "::error::No relay address in the deploy output; pass relay_url."; exit 1; fi
          case "$url" in */) ;; *) url="$url/" ;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 30); do curl -fsS "$url" && break; sleep 5; done
      - name: Check the relay from Russian networks
        env:
          RELAY: ${{ steps.deploy.outputs.url }}
        run: node scripts/probe-relay-russia.mjs
      - name: Publish the address for the application
        if: ${{ inputs.publish }}
        env:
          RELAY: ${{ steps.deploy.outputs.url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B relay-publish "origin/$DEFAULT_BRANCH"
          mkdir -p distribution
          node -e '
            const fs=require("fs"),path="distribution/relays.json",relay=process.env.RELAY;
            let list={schemaVersion:1,relays:[]};
            try{list=JSON.parse(fs.readFileSync(path,"utf8"));}catch{}
            if(!Array.isArray(list.relays))list.relays=[];
            list.schemaVersion=1;list.relays=[relay,...list.relays.filter(x=>x!==relay)].slice(0,5);
            fs.writeFileSync(path,JSON.stringify(list,null,2)+"\n");'
          if git diff --quiet -- distribution/relays.json; then echo "The address is already published."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution/relays.json
          git commit -m "Use the relay at $RELAY for Russia and Belarus"
          git push origin "HEAD:$DEFAULT_BRANCH"
          echo "Published $RELAY in distribution/relays.json on $DEFAULT_BRANCH." >> "$GITHUB_STEP_SUMMARY"
