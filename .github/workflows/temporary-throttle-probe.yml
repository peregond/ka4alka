name: Temporary Cloudflare throttling probe
on:
  push:
    branches: [claude/compassionate-einstein-peg0a1]
    paths: [scripts/probe-cloudflare-throttling.mjs, .github/workflows/temporary-throttle-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-cloudflare-throttling.mjs
