name: Frame experiment (temporary)
# TEMPORARY: decides what made the WindowChrome window's layout loop, and whether the shipping frame settles at every size.
# Removed together with native/FrameExperiment.cs.
on:
  push:
    branches: [claude/cool-turing-p412ok]
    paths: ['.github/workflows/frame-experiment.yml', 'native/**']
permissions:
  contents: read
concurrency:
  group: frame-experiment-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  experiment:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: chrome0-plain, frame: chrome0, band: '0', width: plain, bar: auto, sweep: '0'}
          - {name: chrome0-stable, frame: chrome0, band: '0', width: stable, bar: auto, sweep: '0'}
          - {name: chrome0-bar, frame: chrome0, band: '0', width: plain, bar: visible, sweep: '0'}
          - {name: chrome0-stable-sweep, frame: chrome0, band: '0', width: stable, bar: auto, sweep: '1'}
          - {name: shipping-sweep, frame: manual, band: '32', width: stable, bar: auto, sweep: '1'}
          - {name: shipping-plain-sweep, frame: manual, band: '32', width: plain, bar: auto, sweep: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Publish the app
        shell: pwsh
        run: |
          dotnet publish native/Kachalka.csproj -c Release -r win-x64 --self-contained true -o dist/probe -p:DebugType=None -p:DebugSymbols=false
          if($LASTEXITCODE -ne 0){throw 'Publish failed'}
      - name: Cinema smoke (${{ matrix.name }})
        shell: pwsh
        env:
          KACHALKA_EXPERIMENT_FRAME: ${{ matrix.frame }}
          KACHALKA_EXPERIMENT_BAND: ${{ matrix.band }}
          KACHALKA_EXPERIMENT_WIDTH: ${{ matrix.width }}
          KACHALKA_EXPERIMENT_BAR: ${{ matrix.bar }}
          KACHALKA_EXPERIMENT_SWEEP: ${{ matrix.sweep }}
        run: |
          $env:KACHALKA_DATA=Join-Path $env:RUNNER_TEMP 'probe-data'
          $output=Join-Path $pwd 'test-output/cinema-ui'
          $process=Start-Process dist/probe/Kachalka.exe -ArgumentList @('--cinema-smoke-test',('"'+$output+'"')) -PassThru
          $finished=$process.WaitForExit(600000)
          if(-not $finished){$process.Kill($true)}
          $errorText=if(Test-Path "$output/error.txt"){Get-Content "$output/error.txt" -Raw}else{''}
          $result=if(-not $finished){'HANG'}elseif($errorText -match 'never settled'){'STALL'}elseif($errorText){'FAIL'}elseif(Test-Path "$output/checks.json"){'PASS'}else{'NO-EVIDENCE'}
          "RESULT ${{ matrix.name }} $result"
          if($errorText){$errorText}
          if($result -ne 'PASS'){"::warning title=${{ matrix.name }}::$result"}
