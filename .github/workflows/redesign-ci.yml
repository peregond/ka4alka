name: Redesign verification
on:
  push:
    branches: [claude/cool-turing-p412ok]
    paths: ['native/**', 'tests/**', 'lan-core/**', 'update-core/**', 'updater/**', '.github/workflows/redesign-ci.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: redesign-ci-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      KACHALKA_DATA: ${{ github.workspace }}/test-output/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build the application
        shell: pwsh
        run: ./build.ps1 -OutputDir dist/Kachalka
      - name: Prepare isolated profile and cached posters
        shell: pwsh
        run: |
          $folder=Join-Path $env:KACHALKA_DATA 'downloads'
          New-Item -ItemType Directory -Force $folder | Out-Null
          @{Folder=$folder;FolderConfigured=$true;AutoResumeDownloads=$false;CheckForUpdates=$false;AutoUpdate=$false} | ConvertTo-Json | Set-Content (Join-Path $env:KACHALKA_DATA 'settings.json') -Encoding utf8NoBOM
          ./tests/CacheDesignPosters.ps1
      - name: Run every UI smoke scenario and keep going after failures
        shell: pwsh
        run: |
          $results=@()
          $scenarios=@(
            @{Flag='design';Dir='design';Timeout=180},
            @{Flag='layout';Dir='layout';Timeout=90},
            @{Flag='dpi';Dir='dpi';Timeout=90},
            @{Flag='interface-polish';Dir='interface-polish';Timeout=90},
            @{Flag='download-reliability';Dir='download-reliability';Timeout=90},
            @{Flag='release-freshness';Dir='release-freshness';Timeout=90},
            @{Flag='cover-viewport';Dir='cover-viewport';Timeout=90},
            @{Flag='catalog-navigation';Dir='catalog-navigation';Timeout=120},
            @{Flag='catalog-paging';Dir='catalog-paging';Timeout=90},
            @{Flag='person-performance';Dir='person-performance';Timeout=90},
            @{Flag='bug-report';Dir='bug-report';Timeout=90},
            @{Flag='lan';Dir='lan';Timeout=90},
            @{Flag='cinema';Dir='cinema';Timeout=90},
            @{Flag='cache';Dir='cache';Timeout=90},
            @{Flag='end-to-end';Dir='end-to-end';Timeout=90},
            @{Flag='text-rendering';Dir='text-rendering';Timeout=120},
            @{Flag='close';Dir='close';Timeout=60}
          )
          foreach($s in $scenarios){
            $out=Join-Path $PWD ('test-output/'+$s.Dir)
            $flag=if($s.Flag -eq ''){'--smoke-test'}else{'--'+$s.Flag+'-smoke-test'}
            $status='ok';$detail=''
            try{
              $p=Start-Process (Join-Path $PWD 'dist/Kachalka/Kachalka.exe') -ArgumentList @($flag,('"'+$out+'"')) -PassThru
              if(-not $p.WaitForExit($s.Timeout*1000)){$p.Kill($true);$status='timeout'}
              elseif(Test-Path (Join-Path $out 'error.txt')){$status='failed';$detail=(Get-Content (Join-Path $out 'error.txt') -Raw)}
              elseif($p.ExitCode -ne 0){$status='exit '+$p.ExitCode}
            }catch{$status='crashed';$detail=$_.Exception.Message}
            if($status -eq 'ok' -and -not (Test-Path $out)){$status='noevidence';$detail='exit '+$p.ExitCode+'; output folder was never created'}
            $note='    '+$s.Dir+' exit='+$p.ExitCode+' files='+(@(Get-ChildItem $out -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {$_.Name}) -join ',')
            Write-Output $note
            Add-Content test-output/scenarios.txt $note
            $results+=[pscustomobject]@{Scenario=$s.Dir;Status=$status}
            Write-Output ('=== '+$s.Dir+': '+$status)
            if($detail){Write-Output $detail}
            $log=Join-Path $env:KACHALKA_DATA 'error.log'
            if($status -ne 'ok' -and (Test-Path $log)){Write-Output '--- error.log'; Get-Content $log -Tail 30}
          }
          $results | Format-Table | Out-String | Write-Output
          ($results | ForEach-Object {'| '+$_.Scenario+' | '+$_.Status+' |'}) -join "`n" | Set-Content test-output/summary.md
          if(($results | Where-Object {$_.Status -ne 'ok'}).Count -gt 0){exit 1}
      - name: Run integration tests (logic must not regress)
        if: always()
        shell: pwsh
        run: |
          dotnet run --project tests/Kachalka.Tests.csproj -c Release 2>&1 | Tee-Object -FilePath test-output/integration.txt | Select-Object -Last 40
          if($LASTEXITCODE -ne 0){throw 'Integration tests failed'}
      - name: Publish rendered evidence to the preview branch
        if: always()
        shell: pwsh
        run: |
          $dst=Join-Path $env:RUNNER_TEMP 'evidence'
          New-Item -ItemType Directory -Force $dst | Out-Null
          Get-ChildItem test-output -Recurse -File | Where-Object {$_.FullName -notmatch '\\data\\' -and $_.Extension -in '.png','.json','.txt','.md'} | ForEach-Object {
            $rel=[System.IO.Path]::GetRelativePath((Join-Path $PWD 'test-output'),$_.FullName)
            $target=Join-Path $dst $rel
            New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
            Copy-Item $_.FullName $target
          }
          "commit: ${{ github.sha }}" | Set-Content (Join-Path $dst 'COMMIT.txt')
          Set-Location $dst
          git init -q -b claude/redesign-previews
          git config user.name 'github-actions'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -q -m 'Rendered evidence for ${{ github.sha }}'
          git remote add origin ('https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git')
          git push -f origin claude/redesign-previews
