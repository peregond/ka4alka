name: Layout loop probe (temporary)
# TEMPORARY: proves the cinema smoke's width sweep catches the scroll-bar layout loop (plain widths) and that the
# scroll-stable widths settle. Removed with the KACHALKA_PLAIN_WIDTH switch in native/Design.cs.
on:
  push:
    branches: [claude/cool-turing-p412ok]
    paths: ['.github/workflows/layout-probe.yml', 'native/**']
permissions:
  contents: read
concurrency:
  group: layout-probe-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        plain: ['0', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Publish the app
        shell: pwsh
        run: |
          dotnet publish native/Kachalka.csproj -c Release -r win-x64 --self-contained true -o dist/probe -p:DebugType=None -p:DebugSymbols=false
          if($LASTEXITCODE -ne 0){throw 'Publish failed'}
      - name: Cinema smoke (plain widths ${{ matrix.plain }})
        shell: pwsh
        env:
          KACHALKA_PLAIN_WIDTH: ${{ matrix.plain }}
        run: |
          $env:KACHALKA_DATA=Join-Path $env:RUNNER_TEMP 'probe-data'
          $output=Join-Path $pwd 'test-output/cinema-ui'
          $process=Start-Process dist/probe/Kachalka.exe -ArgumentList @('--cinema-smoke-test',('"'+$output+'"')) -PassThru
          $finished=$process.WaitForExit(120000)
          if(-not $finished){$process.Kill($true)}
          if(Test-Path "$output/error.txt"){Get-Content "$output/error.txt" -Raw}
          if(-not $finished -or (Test-Path "$output/error.txt") -or -not (Test-Path "$output/checks.json")){throw 'Cinema smoke failed (plain widths ${{ matrix.plain }})'}
          'PASS: cinema smoke (plain widths ${{ matrix.plain }})'
