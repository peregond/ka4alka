name: Text catalog regression checks
on:
  pull_request:
    paths:
      - 'native/**'
      - 'tests/**'
      - 'catalog-text-tests/**'
      - 'catalog-audit/**'
      - 'scripts/**'
      - 'web-index/lib/catalog-*.ts'
      - 'web-index/lib/shared-catalog.ts'
      - 'web-index/app/api/catalog/**'
      - 'web-index/tests/catalog-*.mjs'
      - 'web-index/tests/audit-catalog-search.mjs'
      - 'web-index/tests/helpers/**'
      - 'web-index/tests/shared-catalog-limit.mjs'
      - '.github/workflows/catalog-*.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [main, claude/quirky-hopper-1vlmj6]
    paths:
      - 'native/**'
      - 'tests/**'
      - 'catalog-text-tests/**'
      - 'catalog-audit/**'
      - 'scripts/**'
      - 'web-index/lib/catalog-*.ts'
      - 'web-index/lib/shared-catalog.ts'
      - 'web-index/app/api/catalog/**'
      - 'web-index/tests/catalog-*.mjs'
      - 'web-index/tests/audit-catalog-search.mjs'
      - 'web-index/tests/helpers/**'
      - 'web-index/tests/shared-catalog-limit.mjs'
      - '.github/workflows/catalog-*.yml'
      - '.github/workflows/release.yml'
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify producer, publication and bundled resources
        run: |
          python3 scripts/test-refresh-library.py
          python3 scripts/test-library-metadata.py
          python3 scripts/test-catalog-text.py
          python3 scripts/test-catalog-snapshot.py
          python3 scripts/test-catalog-collections.py
          python3 scripts/test-bundle-catalog.py
      - name: Verify bounded web catalog reads
        run: |
          cd web-index
          npm ci --ignore-scripts --no-audit --no-fund
          node tests/shared-catalog-limit.mjs
          node tests/catalog-search.mjs
          node tests/audit-catalog-search.mjs --report ../test-output/server-search-audit.json
      - name: Verify transport and local catalog scheduling
        run: dotnet run --project catalog-text-tests/Kachalka.CatalogTextTests.csproj --configuration Release
      - name: Audit every indexed title and known alias with the real desktop matcher
        run: dotnet run --project catalog-audit/Kachalka.CatalogAudit.csproj -c Release -- --report test-output/native-search-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-search-audit
          path: test-output/*search-audit.json
