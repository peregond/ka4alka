<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Качалка · Remote</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><header><h1>Качалка</h1><span id="device"></span></header><main><section id="pair"><h2 data-ru="Подключить телефон" data-en="Connect your phone"></h2><p data-ru="Телефон и компьютер должны быть в одной сети Wi-Fi. Введи код из настроек приложения на компьютере." data-en="Connect to the same Wi-Fi as your computer. Enter the code shown in the desktop app settings."></p><form id="pair-form"><input id="code" type="text" inputmode="numeric" enterkeyhint="go" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" aria-label="Код / Code" required><button data-ru="Подключиться" data-en="Connect"></button></form></section><section id="remote" hidden><nav><button id="browse" data-ru="Каталог" data-en="Catalog"></button><button id="transfers" data-ru="Загрузки" data-en="Downloads"></button><button id="logout" data-ru="Отключиться" data-en="Disconnect"></button></nav><form id="search"><select id="section" aria-label="Категория / Category"><option value="movies" data-ru="Фильмы" data-en="Movies"></option><option value="series" data-ru="Сериалы" data-en="Series"></option><option value="games" data-ru="Игры для Windows" data-en="Windows games"></option></select><input id="query" type="search" enterkeyhint="search" autocapitalize="none" maxlength="200" aria-label="Поиск / Search"><button data-ru="Найти" data-en="Search"></button></form><div id="results"></div><button id="more" hidden data-ru="Ещё" data-en="More"></button><details><summary data-ru="Добавить magnet-ссылку" data-en="Add a magnet link"></summary><form id="magnet-form"><textarea id="magnet" maxlength="32768" placeholder="magnet:?xt=urn:btih:…" required></textarea><button data-ru="Скачать на компьютере" data-en="Download on computer"></button></form></details></section><p id="status" role="status" aria-live="polite"></p></main><footer data-ru="Файлы сохраняются на компьютере. Приложение должно оставаться запущенным." data-en="Files are saved on your computer. Keep the desktop app running."></footer></body></html>
